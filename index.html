<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kepuasan Pelanggan</title>
  <meta name="description" content="Survei Kepuasan Pelanggan - Portal Web App">
  <meta name="theme-color" content="#0b0f19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- ===================================================================
       TAG PEMANGGIL FAVICON (MENGARAH LANGSUNG KE favicon.ico DI GITHUB)
       Parameter ?v=3 digunakan untuk memotong cache peramban yang membandel
       =================================================================== -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=3">
  <link rel="apple-touch-icon" href="/favicon.ico?v=3">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-surface: #151b26;
      --card-bg: rgba(21, 27, 38, 0.82);
      --card-border: rgba(0, 255, 170, 0.2);
      --accent-neon: #00ffaa;
      --accent-glow: rgba(0, 255, 170, 0.35);
      --accent-hover: #00cc88;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
    }

    .app-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: flex;
      flex-direction: column;
      background: var(--bg-dark);
    }

    .main-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background-color: #ffffff;
      flex: 1;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
    }

    .main-iframe.is-ready {
      opacity: 1;
    }

    /* Indikator Loading Neon Zettbos */
    .preloader-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, #151b26 0%, #0b0f19 80%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 24px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .preloader-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .brand-glow {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .brand-glow::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      animation: pulseGlow 2s infinite ease-in-out;
    }

    .spinner-ring {
      width: 64px;
      height: 64px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: var(--accent-neon);
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }

    .brand-icon {
      position: absolute;
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-neon);
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .loader-title {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      text-align: center;
    }

    .loader-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      text-align: center;
    }

    .progress-bar-container {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-indicator {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      background: linear-gradient(90deg, transparent, var(--accent-neon), transparent);
      animation: progressSlide 1.5s infinite ease-in-out;
    }

    /* Menu Cepat Melayang (Floating HUD) */
    .hud-control {
      position: fixed;
      bottom: calc(18px + var(--safe-bottom));
      right: 18px;
      z-index: 1000;
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-end;
      gap: 10px;
    }

    .hud-trigger-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--accent-neon);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-trigger-btn:hover {
      transform: scale(1.08);
      border-color: var(--accent-neon);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .hud-trigger-btn:active {
      transform: scale(0.95);
    }

    .hud-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 8px;
      border-radius: 14px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transform: translateY(10px) scale(0.95);
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-panel.is-active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .hud-action-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.825rem;
      font-weight: 500;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .hud-action-item:hover {
      background: rgba(0, 255, 170, 0.12);
      color: var(--accent-neon);
    }

    .hud-action-item svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    /* Modal Fallback jika koneksi terhambat */
    .custom-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .custom-modal-backdrop.is-open {
      opacity: 1;
      visibility: visible;
    }

    .custom-modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    .modal-icon-badge {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .modal-btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-solid-neon {
      background: var(--accent-neon);
      color: #0b0f19;
      font-weight: 700;
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s ease, transform 0.1s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-solid-neon:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }

    /* Notifikasi Toast */
    .custom-toast {
      position: fixed;
      top: calc(16px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10001;
    }

    .custom-toast.is-shown {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(0.95); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }
    @keyframes progressSlide {
      0% { left: -45%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>

  <!-- Layar Pembuka / Preloader -->
  <div class="preloader-overlay" id="preloader">
    <div class="brand-glow">
      <div class="spinner-ring"></div>
      <div class="brand-icon">Z</div>
    </div>
    <div class="loader-title">Kepuasan Pelanggan</div>
    <div class="loader-subtitle" id="statusMessage">Menghubungkan ke server aplikasi...</div>
    <div class="progress-bar-container">
      <div class="progress-bar-indicator"></div>
    </div>
  </div>

  <!-- Container Iframe Utama -->
  <div class="app-viewport">
    <iframe 
      id="appIframe" 
      class="main-iframe"
      src="https://script.google.com/macros/s/AKfycbxh28yGEMIrKfyOCLlyHQi3OXnk3S38T7cfJ5ewnq_RJj4sx0sTSXu0s5x7w4Bs7LR6/exec"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; autoplay; payment"
      sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-downloads"
      loading="eager"
      title="Aplikasi Kepuasan Pelanggan">
    </iframe>
  </div>

  <!-- Tombol Aksi HUD -->
  <div class="hud-control">
    <button class="hud-trigger-btn" id="hudToggleBtn" title="Menu Opsi" aria-label="Menu Opsi">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="1"></circle>
        <circle cx="12" cy="5" r="1"></circle>
        <circle cx="12" cy="19" r="1"></circle>
      </svg>
    </button>
    
    <div class="hud-panel" id="hudPanel">
      <button class="hud-action-item" id="btnReloadApp">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span>Muat Ulang Layar</span>
      </button>
      <button class="hud-action-item" id="btnFullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <span id="fullscreenText">Layar Penuh</span>
      </button>
      <button class="hud-action-item" id="btnCopyLink">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <span>Salin Link</span>
      </button>
      <button class="hud-action-item" id="btnOpenDirect">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        <span>Buka di Tab Baru</span>
      </button>
    </div>
  </div>

  <div class="custom-toast" id="customToast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-neon)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toastMessage">Tautan berhasil disalin!</span>
  </div>

  <div class="custom-modal-backdrop" id="fallbackModal">
    <div class="custom-modal-box">
      <div class="modal-icon-badge">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h3 style="margin-bottom: 8px; font-size: 1.15rem;">Koneksi Mengalami Kendala</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;">
        Aplikasi web membutuhkan waktu lebih lama untuk merespons atau memerlukan otorisasi akun Google.
      </p>
      <div class="modal-btn-group">
        <a id="btnModalDirect" href="#" target="_blank" rel="noopener noreferrer" class="btn-solid-neon">
          Buka Tab Baru Langsung
        </a>
        <button class="btn-outline" id="btnModalRetry">
          Coba Muat Ulang
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var TARGET_URL = 'https://script.google.com/macros/s/AKfycbxh28yGEMIrKfyOCLlyHQi3OXnk3S38T7cfJ5ewnq_RJj4sx0sTSXu0s5x7w4Bs7LR6/exec';

      var iframe = document.getElementById('appIframe');
      var preloader = document.getElementById('preloader');
      var statusMsg = document.getElementById('statusMessage');
      var hudToggleBtn = document.getElementById('hudToggleBtn');
      var hudPanel = document.getElementById('hudPanel');
      var btnReload = document.getElementById('btnReloadApp');
      var btnFullscreen = document.getElementById('btnFullscreen');
      var fullscreenText = document.getElementById('fullscreenText');
      var btnCopy = document.getElementById('btnCopyLink');
      var btnOpenDirect = document.getElementById('btnOpenDirect');
      var fallbackModal = document.getElementById('fallbackModal');
      var btnModalDirect = document.getElementById('btnModalDirect');
      var btnModalRetry = document.getElementById('btnModalRetry');
      var customToast = document.getElementById('customToast');
      var toastMessage = document.getElementById('toastMessage');

      var loadTimer = null;
      var toastTimer = null;

      btnModalDirect.href = TARGET_URL;

      function hidePreloader() {
        if (loadTimer) {
          clearTimeout(loadTimer);
          loadTimer = null;
        }
        iframe.classList.add('is-ready');
        preloader.classList.add('is-hidden');
      }

      function showPreloader(msg) {
        statusMsg.textContent = msg || 'Menghubungkan ke server aplikasi...';
        preloader.classList.remove('is-hidden');
        iframe.classList.remove('is-ready');
      }

      function startLoadTimeout() {
        if (loadTimer) {
          clearTimeout(loadTimer);
        }
        loadTimer = setTimeout(function () {
          if (!iframe.classList.contains('is-ready')) {
            fallbackModal.classList.add('is-open');
          }
        }, 14000);
      }

      iframe.addEventListener('load', function () {
        setTimeout(function () {
          hidePreloader();
        }, 350);
      });

      startLoadTimeout();

      hudToggleBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        hudPanel.classList.toggle('is-active');
      });

      document.addEventListener('click', function (e) {
        if (!hudPanel.contains(e.target) && !hudToggleBtn.contains(e.target)) {
          hudPanel.classList.remove('is-active');
        }
      });

      btnReload.addEventListener('click', function () {
        hudPanel.classList.remove('is-active');
        showPreloader('Memuat ulang aplikasi...');
        startLoadTimeout();
        var separator = TARGET_URL.indexOf('?') !== -1 ? '&' : '?';
        iframe.src = TARGET_URL + separator + '_t=' + Date.now();
      });

      btnFullscreen.addEventListener('click', function () {
        hudPanel.classList.remove('is-active');
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(function () {
            showToast('Layar penuh tidak didukung di perangkat ini');
          });
          fullscreenText.textContent = 'Keluar Layar Penuh';
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
          fullscreenText.textContent = 'Layar Penuh';
        }
      });

      document.addEventListener('fullscreenchange', function () {
        if (!document.fullscreenElement) {
          fullscreenText.textContent = 'Layar Penuh';
        } else {
          fullscreenText.textContent = 'Keluar Layar Penuh';
        }
      });

      function showToast(text) {
        toastMessage.textContent = text;
        customToast.classList.add('is-shown');
        if (toastTimer) {
          clearTimeout(toastTimer);
        }
        toastTimer = setTimeout(function () {
          customToast.classList.remove('is-shown');
        }, 2800);
      }

      btnCopy.addEventListener('click', function () {
        hudPanel.classList.remove('is-active');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(TARGET_URL).then(function () {
            showToast('Tautan berhasil disalin!');
          }).catch(function () {
            showToast('Gagal menyalin tautan');
          });
        } else {
          showToast('Clipboard API tidak didukung');
        }
      });

      btnOpenDirect.addEventListener('click', function () {
        hudPanel.classList.remove('is-active');
        window.open(TARGET_URL, '_blank', 'noopener,noreferrer');
      });

      btnModalRetry.addEventListener('click', function () {
        fallbackModal.classList.remove('is-open');
        showPreloader('Mencoba menyambungkan kembali...');
        startLoadTimeout();
        iframe.src = TARGET_URL;
      });

    })();
  </script>
</body>
</html>
